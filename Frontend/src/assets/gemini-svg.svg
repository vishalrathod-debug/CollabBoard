<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Card Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="toolbar-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Main Container Card -->
  <rect x="10" y="10" width="580" height="430" rx="16" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Canvas Background Grid Dot Pattern -->
  <g fill="#CBD5E1" opacity="0.5">
    <circle cx="50" cy="50" r="1.5"/><circle cx="100" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="200" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="300" cy="50" r="1.5"/><circle cx="350" cy="50" r="1.5"/><circle cx="400" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/><circle cx="500" cy="50" r="1.5"/><circle cx="550" cy="50" r="1.5"/>
    <circle cx="50" cy="100" r="1.5"/><circle cx="100" cy="100" r="1.5"/><circle cx="150" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="250" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/><circle cx="350" cy="100" r="1.5"/><circle cx="400" cy="100" r="1.5"/><circle cx="450" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="550" cy="100" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/><circle cx="100" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="200" cy="150" r="1.5"/><circle cx="250" cy="150" r="1.5"/><circle cx="300" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/><circle cx="400" cy="150" r="1.5"/><circle cx="450" cy="150" r="1.5"/><circle cx="500" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/>
    <circle cx="50" cy="200" r="1.5"/><circle cx="100" cy="200" r="1.5"/><circle cx="150" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="250" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="350" cy="200" r="1.5"/><circle cx="400" cy="200" r="1.5"/><circle cx="450" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="550" cy="200" r="1.5"/>
    <circle cx="50" cy="250" r="1.5"/><circle cx="100" cy="250" r="1.5"/><circle cx="150" cy="250" r="1.5"/><circle cx="200" cy="250" r="1.5"/><circle cx="250" cy="250" r="1.5"/><circle cx="300" cy="250" r="1.5"/><circle cx="350" cy="250" r="1.5"/><circle cx="400" cy="250" r="1.5"/><circle cx="450" cy="250" r="1.5"/><circle cx="500" cy="250" r="1.5"/><circle cx="550" cy="250" r="1.5"/>
    <circle cx="50" cy="300" r="1.5"/><circle cx="100" cy="300" r="1.5"/><circle cx="150" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="250" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="350" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/><circle cx="450" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="550" cy="300" r="1.5"/>
    <circle cx="50" cy="350" r="1.5"/><circle cx="100" cy="350" r="1.5"/><circle cx="150" cy="350" r="1.5"/><circle cx="200" cy="350" r="1.5"/><circle cx="250" cy="350" r="1.5"/><circle cx="300" cy="350" r="1.5"/><circle cx="350" cy="350" r="1.5"/><circle cx="400" cy="350" r="1.5"/><circle cx="450" cy="350" r="1.5"/><circle cx="500" cy="350" r="1.5"/><circle cx="550" cy="350" r="1.5"/>
    <circle cx="50" cy="400" r="1.5"/><circle cx="100" cy="400" r="1.5"/><circle cx="150" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="250" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/><circle cx="350" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/><circle cx="450" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/><circle cx="550" cy="400" r="1.5"/>
  </g>

  <!-- Left Floating Toolbar -->
  <rect x="30" y="55" width="38" height="340" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#toolbar-shadow)"/>
  
  <!-- Toolbar Icons -->
  <g fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Select Arrow -->
    <path d="M43 78l12 12-4 1 2 5-3 1-2-5-4 3V78z" fill="#475569" stroke="none"/>
    <!-- Pencil -->
    <path d="M42 120l8-8 3 3-8 8h-3v-3z"/>
    <!-- Rectangle -->
    <rect x="42" y="152" width="14" height="14" rx="2"/>
    <!-- Circle -->
    <circle cx="49" cy="192" r="7"/>
    <!-- Text T -->
    <path d="M44 224h10M49 224v12"/>
    <!-- Sticky Note -->
    <rect x="42" y="260" width="14" height="14" rx="2" fill="#E2E8F0" stroke="none"/>
    <path d="M51 260v5h5"/>
    <!-- Eraser -->
    <path d="M43 304l6-6 6 6-6 6-6-6z"/>
    <!-- Color palette indicator -->
    <circle cx="49" cy="340" r="5" fill="#000000" stroke="none"/>
    <circle cx="49" cy="365" r="4" fill="#6366F1" stroke="none"/>
  </g>

  <!-- Top Right Header Widgets -->
  <g transform="translate(420, 28)">
    <!-- User Avatars -->
    <circle cx="20" cy="15" r="13" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="38" cy="15" r="13" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="56" cy="15" r="13" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Share Button -->
    <rect x="85" y="0" width="65" height="30" rx="8" fill="#6366F1"/>
    <text x="117" y="19" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Share</text>
  </g>

  <!-- CANVAS DRAWINGS & STICKIES -->

  <!-- Red Rectangle -->
  <rect x="200" y="100" width="110" height="70" rx="4" fill="none" stroke="#EF4444" stroke-width="2.5"/>

  <!-- Blue Circle -->
  <ellipse cx="430" cy="135" rx="50" ry="40" fill="none" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Green Sticky Note -->
  <g transform="translate(260, 185) rotate(-3)">
    <rect x="0" y="0" width="75" height="75" rx="4" fill="#BBF7D0" filter="url(#toolbar-shadow)"/>
    <text x="37" y="38" fill="#166534" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Great</text>
    <text x="37" y="52" fill="#166534" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">idea!</text>
  </g>

  <!-- Yellow Sticky Note -->
  <g transform="translate(365, 240) rotate(2)">
    <rect x="0" y="0" width="80" height="80" rx="4" fill="#FEF08A" filter="url(#toolbar-shadow)"/>
    <text x="40" y="40" fill="#854D0E" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Let's do</text>
    <text x="40" y="55" fill="#854D0E" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">this!</text>
  </g>

  <!-- Green Squiggly Line -->
  <path d="M 190 280 Q 220 310, 250 280 T 310 280" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

  <!-- LIVE USER CURSORS -->

  <!-- Alice Cursor (Purple) -->
  <g transform="translate(180, 180)">
    <path d="M0 0l12 12-4 1 2 5-3 1-2-5-4 3V0z" fill="#8B5CF6"/>
    <rect x="10" y="14" width="38" height="18" rx="4" fill="#8B5CF6"/>
    <text x="29" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Alice</text>
  </g>

  <!-- Bob Cursor (Blue) -->
  <g transform="translate(470, 100)">
    <path d="M0 0l12 12-4 1 2 5-3 1-2-5-4 3V0z" fill="#2563EB"/>
    <rect x="10" y="14" width="32" height="18" rx="4" fill="#2563EB"/>
    <text x="26" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Bob</text>
  </g>
</svg>
